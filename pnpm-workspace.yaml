packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  esbuild: true

# Versi tunggal untuk toolchain lintas paket.
# Pakai "catalog:" di package.json agar tidak ada drift versi antar workspace.
catalog:
  typescript: 7.0.2
  vitest: 4.1.10
  "@types/node": ^24.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  zod: 4.4.3

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-fastify@11.2.1'
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
